services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: healthcare_saas_db_local
      POSTGRES_USER: healthcare_user
      POSTGRES_PASSWORD: DevPassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthcare_user -d healthcare_saas_db_local"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://healthcare_user:DevPassword@db:5432/healthcare_saas_db_local
      API_KEY: dev-api-key-change-in-production
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
